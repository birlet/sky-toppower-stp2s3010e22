[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skypsu"
version = "0.1.0"
description = "Unofficial Modbus RTU tools for the SKY TOPPOWER STP2S3010E22 (E22-3010W) lab power supply"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyserial>=3.5", "pyyaml>=6.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
skypsu-scan = "skypsu.scan:main"
skypsu-gui = "skypsu.gui:main"
skypsu-plot = "skypsu.plot:main"

[tool.setuptools]
packages = ["skypsu"]

[tool.setuptools.package-data]
skypsu = ["register_map.yaml", "gui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
